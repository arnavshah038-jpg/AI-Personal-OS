services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aipos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aipos}
      POSTGRES_DB: aipos
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5433:5432"]   # 5433 taaki tumhare local postgres se na takraye
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipos"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.0
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    image: aipos:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aipos:${POSTGRES_PASSWORD:-aipos}@postgres:5432/aipos
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  ui:
    image: aipos:latest
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    env_file: .env
    environment:
      API_URL: http://api:8000
    depends_on:
      api: {condition: service_healthy}
    ports: ["8501:8501"]
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data:
